# gts7xl speaker protection (no Samsung speaker-protection firmware runs on the amps):
# a virtual sink "Speakers (protected)" in front of the on-board speakers: two cascaded
# high-pass biquads at 180 Hz (24 dB/octave) and a fixed -6 dB gain, so even 100 % in any
# volume UI stays below the level where the micro-speakers distort. It is the default sink
# (higher session priority than the hardware sink); USB/Bluetooth outputs are untouched.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Speakers (protected)"
      media.name       = "Speakers (protected)"
      filter.graph = {
        nodes = [
          { type = builtin name = hp1  label = bq_highpass control = { "Freq" = 180.0 "Q" = 0.707 } }
          { type = builtin name = hp2  label = bq_highpass control = { "Freq" = 180.0 "Q" = 0.707 } }
          { type = builtin name = gain label = linear      control = { "Mult" = 0.5 } }
        ]
        links = [
          { output = "hp1:Out" input = "hp2:In" }
          { output = "hp2:Out" input = "gain:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name        = "effect_input.gts7xl_speakers"
        media.class      = Audio/Sink
        priority.session = 2000
        priority.driver  = 2000
      }
      playback.props = {
        node.name           = "effect_output.gts7xl_speakers"
        node.passive        = true
        target.object       = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    }
  }
]
